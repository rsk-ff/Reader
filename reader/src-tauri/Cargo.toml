[package]
name = "reader"
version = "0.1.0"
description = "Lightweight PDF / Markdown desktop reader"
authors = ["Earendil Works"]
edition = "2021"

[lib]
name = "reader_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-single-instance = "2"
tauri-plugin-frame = "=1.1.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"
env_logger = "0.11"
pdfium-render = { version = "0.9", features = ["thread_safe"] }
http = "1"
tauri-plugin-dialog = "2"
tauri-plugin-opener = "~2.5"

# Windows print dialog (ICoreWebView2_16::ShowPrintUI). Same versions Tauri
# already links; no new code is downloaded.
[target.'cfg(windows)'.dependencies]
webview2-com = "0.38"
windows-core = "0.61"
